<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      iOS Safari Dynamic Island/status bar 색상 갱신 우회:
      Safari는 단일 theme-color meta의 content 변경을 일관되게 감지하지 못한다.
      두 개의 meta를 미리 두고 media 속성("all" / "not all")만 swap 하면 안정적으로 갱신된다.
      초기 media 값은 아래 inline script가 저장된 테마에 맞춰 설정한다.
    -->
    <meta id="theme-color-dark" name="theme-color" content="#121418" media="all" />
    <meta id="theme-color-light" name="theme-color" content="#ffffff" media="not all" />
    <title>노벨피아 랭킹 사이트</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.min.css" />
    <script>
      (function() {
        var q = new URLSearchParams(location.search).get('theme');
        var t = 'dark';
        // 저장소가 막힌 브라우저(프라이빗 모드 등)에서도 테마와 theme-color 가 정해지게 한다.
        try {
          if (q === 'light' || q === 'dark') localStorage.setItem('theme', q);
          t = localStorage.getItem('theme') || 'dark';
        } catch (e) {
          t = q === 'light' ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = t === 'light' ? '#ffffff' : '#121418';
        var darkMeta = document.getElementById('theme-color-dark');
        var lightMeta = document.getElementById('theme-color-light');
        if (t === 'light') {
          lightMeta.setAttribute('media', 'all');
          darkMeta.setAttribute('media', 'not all');
        } else {
          darkMeta.setAttribute('media', 'all');
          lightMeta.setAttribute('media', 'not all');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="datepicker-portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
